<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>献立アプリは移転しました</title>
  <meta name="theme-color" content="#e0703a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #faf6f0; --surface: #fff; --text: #2b2520; --muted: #7b7068; --line: #e7ddd0; --accent: #e0703a; --accent-ink: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1a1714; --surface: #25211d; --text: #f2ebe3; --muted: #a99e93; --line: #3b3530; --accent: #f08a52; --accent-ink: #1a1714; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; line-height: 1.6; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 8px 0; }
    .muted { color: var(--muted); font-size: .9rem; }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    a { color: var(--accent); }
    code { font-size: .85rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>🍱 献立アプリは移転しました</h1>
      <p>新しい場所：<a id="newLink" href="https://stock.yurukichi.com/meal/">stock.yurukichi.com/meal/</a></p>
      <p class="muted">在庫アプリと一緒に使えるようになりました。ホーム画面に追加している場合は、新しい場所で追加し直してください。</p>

      <div id="withData" hidden>
        <p><b>この端末に献立のデータがあります。</b>（レシピ <span id="recipeCount">0</span>件・献立 <span id="planCount">0</span>週分・家族や好みなどの設定）</p>
        <button class="btn primary" id="moveWithData" type="button">データを持って新しい場所へ移動</button>
        <button class="btn" id="downloadBackup" type="button">バックアップを書き出す（JSON）</button>
        <a class="btn" id="moveOnly" href="https://stock.yurukichi.com/meal/">データを持たずに移動</a>
        <p class="muted">Gemini のAPIキーは引き継がれません。新しい場所で設定し直してください。</p>
        <p class="muted" id="status" role="status"></p>
      </div>
      <p id="noData" class="muted" hidden>新しい場所へ移動しています…</p>
    </div>
  </main>
  <script>
    (function () {
      var NEW_URL = 'https://stock.yurukichi.com/meal/';
      var STORAGE_KEY = 'kondate-app-v1';
      // URL で渡せる長さの目安（超える場合はファイルで渡す）
      var MAX_HASH_CHARS = 60000;

      // 古い献立アプリのキャッシュ（サービスワーカー）を片付ける。
      // matony3.github.io は他のプロジェクトとも共有しているので、このページのフォルダのものだけを外す
      var APP_SCOPE = new URL('./', location.href).href;
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (r.scope === APP_SCOPE) r.unregister(); });
        }).catch(function () {});
      }

      var data = null;
      try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { data = null; }
      var recipes = data && Array.isArray(data.recipes) ? data.recipes.length : 0;
      var plans = data && data.plans ? Object.keys(data.plans).length : 0;

      // 献立アプリは操作したときだけ保存するので、保存データがあれば（設定や好みだけでも）引き継ぎを案内する
      if (!data || typeof data !== 'object') {
        document.getElementById('noData').hidden = false;
        location.replace(NEW_URL);
        return;
      }

      document.getElementById('withData').hidden = false;
      document.getElementById('recipeCount').textContent = recipes;
      document.getElementById('planCount').textContent = plans;
      var status = document.getElementById('status');

      function backupData() {
        var copy = JSON.parse(JSON.stringify(data));
        if (copy.settings) copy.settings.apiKey = '';
        return copy;
      }

      function toBase64Url(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      // 新しい場所の meal/js/transfer.js と同じ形式（"g." + gzip + base64url、圧縮できない環境は "j." + JSON）
      function encodeTransfer(obj) {
        var json = new TextEncoder().encode(JSON.stringify(obj));
        if (typeof CompressionStream !== 'function') return Promise.resolve('j.' + toBase64Url(json));
        var stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
        return new Response(stream).arrayBuffer().then(function (buf) { return 'g.' + toBase64Url(new Uint8Array(buf)); });
      }

      function download() {
        var blob = new Blob([JSON.stringify(backupData(), null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kondate-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      }

      document.getElementById('downloadBackup').addEventListener('click', function () {
        download();
        status.textContent = '書き出しました。新しい場所の「設定 → バックアップを読み込む」で読み込めます。';
      });

      document.getElementById('moveWithData').addEventListener('click', function () {
        status.textContent = '準備しています…';
        encodeTransfer(backupData()).then(function (payload) {
          if (payload.length > MAX_HASH_CHARS) {
            download();
            status.textContent = 'データが大きいため、ファイルに書き出しました。新しい場所の「設定 → バックアップを読み込む」で読み込んでください。';
            return;
          }
          location.href = NEW_URL + '#import=' + payload;
        }).catch(function () {
          download();
          status.textContent = '自動で引き継げなかったため、ファイルに書き出しました。新しい場所の「設定 → バックアップを読み込む」で読み込んでください。';
        });
      });
    })();
  </script>
</body>
</html>
